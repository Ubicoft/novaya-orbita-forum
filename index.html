<!doctype html>
<html lang="ru" data-theme="winter">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Форум межуниверситетского объединения студенческих инициатив «Новая Орбита»" />
    <meta name="theme-color" content="#06101f" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Форум · Новая Орбита</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" />
    <script>
      try {
        var t = localStorage.getItem("novaya-orbita.theme");
        if (t === "winter" || t === "blue" || t === "pink" || t === "green") {
          document.documentElement.dataset.theme = t;
        }
        var lang = new URLSearchParams(location.search).get("lang");
        if (lang === "ru" || lang === "en" || lang === "tj") {
          document.documentElement.lang = lang === "tj" ? "tg" : lang;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
